services:
  poll:
    build: ./poll
    ports:
      - "5000:80"
    networks:
      - poll-tier
      - back-tier
    restart: unless-stopped

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    networks:
      - back-tier
    restart: unless-stopped

  worker:
    build: ./worker
    networks:
      - back-tier
    restart: unless-stopped

  db:
    image: postgres:15
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: poll_db
      POSTGRES_USER: poll_user
      POSTGRES_PASSWORD: poll_password
    networks:
      - back-tier
    restart: unless-stopped

  result:
    build: ./result
    ports:
      - "5001:80"
    networks:
      - result-tier
      - back-tier
    restart: unless-stopped

networks:
  poll-tier:
  result-tier:
  back-tier:

volumes:
  db-data:
